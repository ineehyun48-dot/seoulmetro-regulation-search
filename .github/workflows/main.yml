name: Update regulations

on:
  workflow_dispatch:
  schedule:
    # 매일 한국시간 오전 9시 15분 실행
    - cron: '15 0 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 서울교통공사 사규 업데이트 확인
        env:
          SEOULMETRO_RULES_URL: "https://www.seoulmetro.co.kr/kr/board.do?menuIdx=518"
        run: |
          python scripts/update_regulations.py

      - name: 변경사항 저장
        run: |
          git config user.name "regulation-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "변경된 사규가 없습니다."
          else
            git commit -m "운전관계규정 자동 업데이트"
            git push
          fi
