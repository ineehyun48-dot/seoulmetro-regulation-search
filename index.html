  "운전무사고성적심사규정":"운전무사고성적심사규정.pdf",
  "운전취급규정":"운전취급규정.pdf",
  "운전취급세부요령":"운전취급세부요령.pdf",
  "차량기지운전취급내규":"차량기지운전취급내규.pdf",
  "철도차량운전면허교육훈련운영규정":"철도차량운전면허교육훈련운영규정.pdf"
};
function pdfHref(doc){return encodeURI(PDF_FILES[doc]||"")}
let selectedDoc="";
const quick=["열차 화재","차량고장","신호기 고장","비상제동","대용폐색","전령법","입환","입·출고","무사고 포상"];
document.getElementById("chips").innerHTML=quick.map(x=>`<span class="chip" onclick="quickSearch('${x}')">${x}</span>`).join("");
const docNames=[...new Set(DATA.map(x=>x.doc))];
document.getElementById("docs").innerHTML=docNames.map(x=>`<button class="docbtn" onclick="setDoc(this,'${x.replaceAll("'","\\'")}')">${x}</button>`).join("");
function norm(s){return (s||"").toLowerCase().replace(/\s+/g,"")}
function quickSearch(x){document.getElementById("q").value=x;render()}
function setDoc(el,name){selectedDoc=name;document.querySelectorAll(".docbtn").forEach(b=>b.classList.remove("active"));el.classList.add("active");render()}
function score(item,q){
 let terms=q.toLowerCase().split(/\s+/).filter(Boolean); if(!terms.length)return 1;
 let hay=norm(item.doc+" "+item.title+" "+item.summary+" "+item.keys); let s=0;
 for(const t of terms){let n=norm(t); if(hay.includes(n))s+=3; for(const k of n.split(/[,/]/)){if(k&&hay.includes(k))s++}}
 const synonyms={"불":["화재"],"불났":["화재"],"고장":["고장","이례상황"],"신호":["신호기","폐색"],"브레이크":["제동"],"구원":["구원열차","전령법"],"사고":["이례상황","사고"],"터널":["정거장간"],"차고":["기지"],"기지":["차량기지"]};
 for(const [a,bs] of Object.entries(synonyms))if(norm(q).includes(a))for(const b of bs)if(hay.includes(norm(b)))s+=2;
 return s;
}
function render(){
 let q=document.getElementById("q").value.trim();
 let arr=DATA.filter(x=>!selectedDoc||x.doc===selectedDoc).map(x=>({...x,_s:score(x,q)})).filter(x=>!q||x._s>0).sort((a,b)=>b._s-a._s);
 document.getElementById("count").textContent=`${arr.length}건`;
 const r=document.getElementById("results");
 if(!arr.length){r.innerHTML=`<div class="empty">일치하는 결과가 없습니다.<br>다른 표현이나 핵심 키워드로 검색해 보세요.</div>`;return}
 r.innerHTML=arr.map(x=>`<article class="card"><div class="doc">${x.doc}</div><div class="title">${x.title}</div><div class="summary">${x.summary}</div><div class="meta"><span>📌 ${x.rev}</span><a class="pdfbtn" href="${pdfHref(x.doc)}" target="_blank" rel="noopener">📄 원문 보기</a></div></article>`).join("");
}
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")render()});render();
</script></body></html>
