<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>운전관계규정 간편검색 시스템</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:#f4f7fb;color:#172033}header{background:#12345b;color:#fff;padding:18px 24px}.wrap{max-width:1150px;margin:auto}.brand{font-size:22px;font-weight:800}.sub{font-size:12px;opacity:.82;margin-top:4px}main{padding:28px 18px 50px}.hero,.panel{background:#fff;border-radius:18px;box-shadow:0 7px 25px #1d35570d}.hero{padding:25px}h1{margin:0 0 7px;font-size:28px}.lead{color:#647287;margin:0 0 18px}.search{display:flex;gap:9px}.search input{flex:1;padding:15px;border:2px solid #d9e2ed;border-radius:12px;font-size:16px}.search button{border:0;border-radius:12px;padding:0 22px;background:#1f5f9e;color:#fff;font-weight:700;cursor:pointer}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.chip{border:0;background:#edf4fb;color:#285a88;padding:8px 11px;border-radius:999px;cursor:pointer}.status{margin-top:15px;padding:11px 13px;background:#eef8f0;border-radius:10px;font-size:12px;color:#356241}.layout{display:grid;grid-template-columns:270px 1fr;gap:18px;margin-top:18px}.panel{padding:17px}.docbtn{width:100%;border:0;text-align:left;background:#f5f8fc;padding:10px;border-radius:9px;margin:5px 0;cursor:pointer}.docbtn.active{background:#dcecff;color:#124c83}.rev{display:block;font-size:10px;color:#7c8795;margin-top:3px}.head{display:flex;justify-content:space-between;border-bottom:1px solid #edf0f4;padding-bottom:11px}.card{border:1px solid #e2e8f0;border-radius:13px;padding:16px;margin-top:11px}.doc{font-size:12px;color:#316b9f;font-weight:700}.title{font-size:17px;font-weight:800;margin:5px 0}.body{white-space:pre-line;line-height:1.65;color:#3d4a5a;max-height:250px;overflow:auto}.meta{font-size:11px;color:#7b8795;margin-top:9px}.warn{margin-top:16px;padding:12px;background:#fff8e6;border:1px solid #f0dfa9;border-radius:10px;font-size:12px;line-height:1.6}.empty{text-align:center;color:#788596;padding:55px 10px}@media(max-width:760px){.layout{grid-template-columns:1fr}.search{flex-direction:column}.search button{padding:13px}}
</style></head><body><header><div class="wrap"><div class="brand">🚇 운전관계규정 간편검색 시스템</div><div class="sub">서울교통공사 운전관련 사규 · 자동 업데이트 대응형</div></div></header><main class="wrap"><section class="hero"><h1>상황이나 키워드로 검색하세요</h1><p class="lead">규정명, 조문, 제목과 원문을 한 번에 검색합니다.</p><div class="search"><input id="q" placeholder="예: 열차 화재, 전령법, 신호기 고장, 입환, 교육훈련"><button onclick="render()">검색</button></div><div class="chips" id="chips"></div><div class="status" id="status">데이터를 불러오는 중입니다.</div></section><div class="layout"><aside class="panel"><b>관련 사규</b><div id="docs"></div><div class="warn">⚠️ 안전 관련 업무는 검색 결과만으로 판단하지 말고 반드시 최신 공식 원문과 관제·사내 절차를 확인하세요.</div></aside><section class="panel"><div class="head"><b>검색 결과</b><span id="count"></span></div><div id="results"></div></section></div></main><script>
let DB={documents:[]}, filter='전체'; const synonyms={화재:['불','연기','발화'],고장:['장애','불능','작동불량'],입환:['차량이동'],전령법:['전령'],교육:['훈련','면허']};
const norm=s=>(s||'').toLowerCase().replace(/\s+/g,' '); function terms(q){let a=norm(q).split(' ').filter(Boolean); for(const [k,v] of Object.entries(synonyms)) if(a.some(x=>x.includes(k)||v.some(y=>x.includes(y)))) a.push(k,...v); return [...new Set(a)]}
function docButtons(){let el=document.getElementById('docs'); el.innerHTML=''; [['전체','전체 사규'],...DB.documents.map(d=>[d.name,d.name])].forEach(([key,label])=>{let b=document.createElement('button');b.className='docbtn'+(filter===key?' active':'');b.innerHTML=label+(key==='전체'?'':`<span class="rev">${DB.documents.find(d=>d.name===key)?.revision||'개정정보 확인 필요'}</span>`);b.onclick=()=>{filter=key;docButtons();render()};el.appendChild(b)})}
function render(){let q=document.getElementById('q').value.trim(), ts=terms(q), out=[]; for(const d of DB.documents){if(filter!=='전체'&&d.name!==filter)continue; for(const a of d.articles||[]){let hay=norm(d.name+' '+a.article+' '+a.title+' '+a.text); let score=ts.length?ts.reduce((n,t)=>n+(hay.includes(t)?1:0),0):0;if(q&&score)out.push({d,a,score})}} out.sort((x,y)=>y.score-x.score);document.getElementById('count').textContent=q?`${out.length}건`:'검색어를 입력하세요';let r=document.getElementById('results');if(!q){r.innerHTML='<div class="empty">검색어를 입력하면 관련 조문이 표시됩니다.</div>';return}if(!out.length){r.innerHTML='<div class="empty">일치하는 조문을 찾지 못했습니다. 다른 핵심어로 검색해 보세요.</div>';return}r.innerHTML=out.slice(0,80).map(x=>`<article class="card"><div class="doc">${esc(x.d.name)}</div><div class="title">${esc(x.a.article)} ${esc(x.a.title? '('+x.a.title+')':'')}</div><div class="body">${esc(x.a.text)}</div><div class="meta">${esc(x.d.revision||'개정정보 확인 필요')} · 검색 DB 원문 추출</div></article>`).join('')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function init(){try{let r=await fetch('regulations.json',{cache:'no-store'});DB=await r.json();docButtons();let g=DB.generated||'';document.getElementById('status').textContent=`✓ ${DB.documents.length}개 사규 로드 · DB 갱신 ${String(g).slice(0,19).replace('T',' ')}`;if(DB.missing_or_unresolved?.length)document.getElementById('status').textContent+=` · 확인 필요 ${DB.missing_or_unresolved.length}건`;render()}catch(e){document.getElementById('status').textContent='데이터 로드 실패: 웹서버(Netlify 등)에서 실행해 주세요.'}}
['열차 화재','차량 고장','전령법','대용폐색','입환','비상제동','교육훈련'].forEach(x=>{let b=document.createElement('button');b.className='chip';b.textContent=x;b.onclick=()=>{q.value=x;render()};chips.appendChild(b)});q.addEventListener('keydown',e=>{if(e.key==='Enter')render()});init();
</script></body></html>
